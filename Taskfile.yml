version: '3'

vars:
  BINARY_NAME: better-pocketbase
  BUILD_DIR: bin

tasks:
  build:
    desc: Build the PocketBase server binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -buildvcs=false -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} ./{{.BINARY_NAME}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run Go tests
    cmds:
      - go test -buildvcs=false ./...

  run:
    desc: Run the PocketBase server
    cmds:
      - go run -buildvcs=false . serve {{.CLI_ARGS}}
